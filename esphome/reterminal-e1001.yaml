# Seeed Studio reTerminal E1001 - Departure Board
# ESP32-S3 with 7.5" e-ink display
#
# Fetches departure board image from API and displays on e-ink.
# Includes battery level from onboard sensor.
# Weather data (temp, humidity, rain, UV, wind, AQI, sunrise/sunset) is
# sourced server-side via Open-Meteo API using the lat/lon coordinates.
# Device temp/humidity sensors can optionally override API values via query params.
#
# Layout options (set use_sidebar in substitutions):
#   - sidebar=true: 2/3 timetable + 1/3 weather & alerts panel
#   - sidebar=false: Full-width timetable with sensor data in footer
#
# Uses deep sleep for battery efficiency:
#   - ~1 min total cycle during active hours (4am-9pm)
#   - ~2 min total cycle during quiet hours (9pm-4am)
# Sleep duration is dynamically reduced to compensate for run time
# (WiFi, image download, etc.) so total cycle hits the target interval.

substitutions:
  board_url: "https://next-departure.vercel.app/api/og/board?stops=tram:2070,train:1201:1&limit=3&invert=true"
  # Set to "true" to enable sidebar layout with weather & alerts panel (1/3 of screen)
  # Set to "false" to show sensor data in footer instead
  use_sidebar: "true"
  # Location for weather data and timezone derivation (lat/lon in decimal degrees)
  # Find your coordinates: https://www.latlong.net/
  latitude: "-37.8136"
  longitude: "144.9631"

esphome:
  name: reterminal-e1001
  friendly_name: "Departure Board"
  on_boot:
    priority: -100
    then:
      - wait_until:
          wifi.connected:
      - wait_until:
          lambda: "return id(sntp_time).now().is_valid();"
      # Enable battery voltage divider, read, then disable to save power
      - switch.turn_on: battery_enable
      - delay: 50ms # Allow voltage to stabilize
      - component.update: battery_voltage
      - switch.turn_off: battery_enable
      - delay: 50ms
      - component.update: battery_level
      - delay: 50ms
      # Update URL with battery and location, then fetch image
      # Weather data (temp, humidity, etc.) sourced server-side via Open-Meteo API
      - online_image.set_url:
          id: departure_image
          url: !lambda |-
            char url[512];
            snprintf(url, sizeof(url),
              "${board_url}&t=%lu&battery=%.0f&sidebar=${use_sidebar}&lat=${latitude}&lon=${longitude}",
              millis(),
              id(battery_level).state);
            return std::string(url);
      # Trigger the image download (set_url alone doesn't fetch)
      - component.update: departure_image
      # Wait for the download to actually complete instead of a fixed delay
      - wait_until:
          condition:
            lambda: 'return id(image_downloaded);'
          timeout: 20s
      - lambda: |-
          // RTC_DATA_ATTR survives deep sleep (stored in RTC slow memory)
          static RTC_DATA_ATTR int rtc_refresh_counter = 0;

          ESP_LOGI("display", "Refresh counter: %d (full refresh every 10)", rtc_refresh_counter);

          if (rtc_refresh_counter % 10 == 0) {
            ESP_LOGI("display", "Full refresh");
            id(epaper_display).set_full_update_every(1);
          } else {
            ESP_LOGI("display", "Partial refresh");
            id(epaper_display).set_full_update_every(999);
          }

          rtc_refresh_counter = (rtc_refresh_counter + 1) % 10;
      - component.update: epaper_display
      - delay: 1s
      - lambda: |-
          auto time = id(sntp_time).now();
          int hour = time.hour;
          int target_ms = (hour >= 4 && hour < 21) ? 60000 : 120000;
          int run_time_ms = millis();
          int sleep_ms = target_ms - run_time_ms;
          if (sleep_ms < 10000) sleep_ms = 10000; // Minimum 10s sleep
          ESP_LOGW("sleep", "Run time: %dms, sleeping: %dms", run_time_ms, sleep_ms);
          id(deep_sleep_control).set_sleep_duration(sleep_ms);
      - deep_sleep.enter: deep_sleep_control

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
  flash_size: 32MB

psram:
  mode: octal
  speed: 80MHz

logger:
  level: WARN
  baud_rate: 0

# API disabled - not useful with deep sleep (device asleep 99% of time)
# api:
#   encryption:
#     key: !secret api_encryption_key

ota:
  platform: esphome
  password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  manual_ip:
    static_ip: 192.168.50.136
    gateway: 192.168.50.1
    subnet: 255.255.255.0
    dns1: 192.168.50.1

time:
  - platform: sntp
    id: sntp_time
    timezone: Australia/Melbourne

http_request:
  verify_ssl: false
  timeout: 15s

# I2C and SHT4x sensor disabled - weather now sourced from Open-Meteo API.
# Uncomment and add &temp=%.1f&humidity=%.0f to URL to use device sensors instead.
# i2c:
#   sda: GPIO19
#   scl: GPIO20
#   scan: true
#
# sensor (SHT4x):
#   - platform: sht4x
#     id: sht4x_sensor
#     address: 0x44
#     temperature:
#       name: "Temperature"
#       id: temperature
#       unit_of_measurement: "°C"
#       accuracy_decimals: 1
#     humidity:
#       name: "Humidity"
#       id: humidity
#       unit_of_measurement: "%"
#       accuracy_decimals: 0
#     update_interval: never

sensor:
  # Battery voltage monitoring
  - platform: adc
    pin: GPIO1
    id: battery_voltage
    name: "Battery Voltage"
    update_interval: never
    attenuation: 12db
    filters:
      - multiply: 2.0 # Voltage divider compensation

  # Battery percentage (approximate)
  - platform: template
    name: "Battery Level"
    id: battery_level
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: never
    lambda: |-
      float voltage = id(battery_voltage).state;
      // LiPo battery: 4.2V = 100%, 3.0V = 0%
      float percentage = (voltage - 3.0) / (4.2 - 3.0) * 100.0;
      if (percentage < 0.0) percentage = 0.0;
      if (percentage > 100.0) percentage = 100.0;
      return percentage;

# Battery enable pin (must be HIGH to read battery voltage on E1001)
switch:
  - platform: gpio
    pin: GPIO21
    id: battery_enable
    restore_mode: ALWAYS_OFF # Save power, only enable when reading

deep_sleep:
  id: deep_sleep_control
  run_duration: 30s
  sleep_duration: 1min

globals:
  - id: image_downloaded
    type: bool
    restore_value: no
    initial_value: 'false'

online_image:
  - id: departure_image
    url: "${board_url}" # Initial URL, updated dynamically with sensor data
    format: PNG
    type: BINARY
    resize: 800x480
    update_interval: never # Only download when explicitly triggered
    on_download_finished:
      - globals.set:
          id: image_downloaded
          value: 'true'
    on_error:
      - logger.log:
          level: ERROR
          format: "Image download failed"
      - globals.set:
          id: image_downloaded
          value: 'true'

spi:
  clk_pin: GPIO7
  mosi_pin: GPIO9

display:
  - platform: waveshare_epaper
    id: epaper_display
    model: 7.50inv2p
    full_update_every: 999  # Controlled manually via RTC memory counter (survives deep sleep)
    cs_pin: GPIO10
    dc_pin: GPIO11
    reset_pin:
      number: GPIO12
      inverted: false
    busy_pin:
      number: GPIO13
      inverted: true
    update_interval: never
    lambda: |-
      it.image(0, 0, id(departure_image));
