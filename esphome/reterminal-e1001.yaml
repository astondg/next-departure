# Seeed Studio reTerminal E1001 - Departure Board
# ESP32-S3 with 7.5" e-ink display
#
# Fetches departure board image from API and displays on e-ink.
# Uses deep sleep for battery efficiency:
#   - 1 min refresh during active hours (4am-9pm)
#   - 2 min refresh during quiet hours (9pm-4am)

esphome:
  name: reterminal-e1001
  friendly_name: "Departure Board"
  on_boot:
    priority: -100
    then:
      - wait_until:
          wifi.connected:
      - wait_until:
          lambda: 'return id(sntp_time).now().is_valid();'
      - component.update: departure_image
      - delay: 5s
      - component.update: epaper_display
      - delay: 1s
      - lambda: |-
          auto time = id(sntp_time).now();
          int hour = time.hour;
          int sleep_mins = (hour >= 4 && hour < 21) ? 1 : 2;
          id(deep_sleep_control).set_sleep_duration(sleep_mins * 60000);
      - deep_sleep.enter: deep_sleep_control

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
  flash_size: 32MB

psram:
  mode: octal
  speed: 80MHz

logger:
  level: WARN
  baud_rate: 0  # Disable serial logging

api:
  encryption:
    key: !secret api_encryption_key

ota:
  platform: esphome
  password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

time:
  - platform: sntp
    id: sntp_time
    timezone: Australia/Melbourne

http_request:
  verify_ssl: false
  timeout: 15s

deep_sleep:
  id: deep_sleep_control
  run_duration: 30s
  sleep_duration: 1min

online_image:
  - id: departure_image
    url: "https://next-departure.vercel.app/api/og/board/eink?stops=tram:2070,train:1207,train:1201&limit=3"
    format: PNG
    type: BINARY
    resize: 800x480

spi:
  clk_pin: GPIO7
  mosi_pin: GPIO9

display:
  - platform: waveshare_epaper
    id: epaper_display
    model: 7.50inv2p
    full_update_every: 10
    cs_pin: GPIO10
    dc_pin: GPIO11
    reset_pin:
      number: GPIO12
      inverted: false
    busy_pin:
      number: GPIO13
      inverted: true
    update_interval: never
    lambda: |-
      it.image(0, 0, id(departure_image));
